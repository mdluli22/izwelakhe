services:
  website:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: izwelakhe-website
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-3001}:3000"
    environment:
      NODE_ENV: production
      SMTP_HOST: "${SMTP_HOST:?SMTP_HOST must be set}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_SECURE: "${SMTP_SECURE:-}"
      SMTP_REQUIRE_TLS: "${SMTP_REQUIRE_TLS:-}"
      SMTP_USER: "${SMTP_USER:?SMTP_USER must be set}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:?SMTP_PASSWORD must be set}"
      SMTP_FROM: "${SMTP_FROM:?SMTP_FROM must be set}"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
